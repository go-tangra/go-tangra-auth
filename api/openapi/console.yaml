openapi: 3.1.0
info:
  title: Freya Auth — Console & Public API
  version: 1.2.0
  description: |
    Browser-facing API served on the edge listener. All state-changing requests need
    the CSRF header. Errors are `{"reason": "<closed vocabulary>"}`. Every response
    is scoped to the caller's tenant; ids from other tenants behave as not found
    (404) after being audited as cross_tenant_refused.
servers:
  - url: https://auth.example.org
security:
  - sessionCookie: []
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: __Host-session }
  parameters:
    csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
  schemas:
    Error:
      type: object
      required: [reason]
      properties: { reason: { type: string } }
    TenantRef:
      type: object
      properties: { id: { type: string, format: uuid }, slug: { type: string }, display_name: { type: string }, status: { type: string, enum: [active, suspended] } }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        status: { type: string, enum: [invited, active, deactivated, locked, imported] }
        mfa_enabled: { type: boolean }
        roles: { type: array, items: { type: string } }
        last_signin_at: { type: string, format: date-time, nullable: true }
        directory:
          type: object
          nullable: true
          description: Directory origin of an imported user; null for users that never came from a directory. Never carries the DN.
          properties:
            connection_id: { type: string, format: uuid, nullable: true, description: null once the connection is deleted }
            connection_name: { type: string }
            directory_uid: { type: string }
            last_imported_at: { type: string, format: date-time }
        invitation_id: { type: string, format: uuid, nullable: true, description: pending invitation of an invited user (enables resend) }
    SecurityKey:
      type: object
      description: A registered security key (feature 018). Never the credential id or public key.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 64 }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        flagged: { type: boolean, description: possibly cloned (signature counter did not increase); refused until removed }
    MfaState:
      type: object
      properties:
        totp: { type: boolean }
        keys: { type: array, items: { $ref: '#/components/schemas/SecurityKey' } }
        recovery_codes_left: { type: integer }
        required: { type: boolean, description: tenant policy requires a second factor }
        webauthn: { type: object, properties: { enabled: { type: boolean }, rp_id: { type: string, description: 'host name keys are bound to' } } }
    WebAuthnCredential:
      type: object
      description: 'PublicKeyCredential.toJSON() (W3C JSON serialisation, base64url fields); parsed server-side within 64 KiB'
      required: [id, type, response]
      properties:
        id: { type: string, maxLength: 1400 }
        rawId: { type: string, maxLength: 1400 }
        type: { type: string, enum: [public-key] }
        response: { type: object }
        authenticatorAttachment: { type: string, nullable: true }
        clientExtensionResults: { type: object }
    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        display_name: { type: string }
        builtin: { type: boolean }
        permissions: { type: array, items: { type: string, pattern: '^[a-z][a-z0-9_-]*:[a-z][a-z0-9_-]*$' } }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean }
        user_agent: { type: string }
    Name: { type: string, maxLength: 100, pattern: '^[^\p{Cc}]*$', description: 'trimmed; no control characters' }
    Phone: { type: string, maxLength: 24, description: 'E.164 after normalisation (+[1-9][0-9]{6,14}); empty clears; PII - never logged' }
    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        first_name: { $ref: '#/components/schemas/Name' }
        last_name: { $ref: '#/components/schemas/Name' }
        phone: { $ref: '#/components/schemas/Phone' }
        avatar_url: { type: string }
        updated_at: { type: string, format: date-time, nullable: true }
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        first_name: { $ref: '#/components/schemas/Name' }
        last_name: { $ref: '#/components/schemas/Name' }
        phone: { $ref: '#/components/schemas/Phone' }
        display_name: { type: string, maxLength: 100, pattern: '^[^\p{Cc}]*$' }
    PublicProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        avatar_url: { type: string }
        email: { type: string, description: only in search results }
    Group:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string, maxLength: 500 }
        member_count: { type: integer }
        roles: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GroupInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64, pattern: '^[^\p{Cc}]+$' }
        description: { type: string, maxLength: 500, pattern: '^[^\p{Cc}]*$' }
    GroupMember:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        avatar_url: { type: string }
        status: { type: string }
        added_at: { type: string, format: date-time }
    EffectiveRole:
      type: object
      properties:
        role_id: { type: string, format: uuid }
        slug: { type: string }
        sources: { type: array, items: { type: object, properties: { kind: { type: string, enum: [direct, group] }, group_id: { type: string, format: uuid }, group_name: { type: string } } } }
    UserGroupRef:
      type: object
      properties: { id: { type: string, format: uuid }, name: { type: string } }
    Policy:
      type: object
      additionalProperties: false
      properties:
        session_lifetime: { type: string, example: 8h }
        idle_timeout: { type: string, example: 1h }
        access_token_lifetime: { type: string, example: 15m }
        password_min_length: { type: integer, minimum: 8 }
        mfa_required: { type: boolean }
        lockout_threshold: { type: integer, minimum: 3, maximum: 20 }
        lockout_duration: { type: string, example: 15m }
    AuditEvent:
      type: object
      properties:
        ts: { type: string, format: date-time }
        event_type: { type: string }
        actor: { type: string }
        subject: { type: string }
        outcome: { type: string, enum: [ok, refused, failed] }
        reason: { type: string }
        correlation_id: { type: string }
        details: { type: object, additionalProperties: true }
    TokenResponse:
      type: object
      properties: { access_token: { type: string }, token_type: { type: string, enum: [Bearer] }, expires_in: { type: integer } }
    DirectoryAttributes:
      type: object
      additionalProperties: false
      description: LDAP attribute names; omitted or empty ones default from the kind
      properties:
        uid: { $ref: '#/components/schemas/DirectoryAttributeName' }
        email: { $ref: '#/components/schemas/DirectoryAttributeName' }
        display_name: { $ref: '#/components/schemas/DirectoryAttributeName' }
        first_name: { $ref: '#/components/schemas/DirectoryAttributeName' }
        last_name: { $ref: '#/components/schemas/DirectoryAttributeName' }
    DirectoryAttributeName: { type: string, maxLength: 64, pattern: '^([A-Za-z][A-Za-z0-9-]{0,63})?$' }
    DirectoryConnection:
      type: object
      description: A tenant's LDAP connection. Never carries the bind password, only bind_password_set.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [active_directory, openldap, other] }
        url: { type: string }
        tls_mode: { type: string, enum: [ldaps, starttls, plain] }
        allow_tls12: { type: boolean }
        ca_pem_set: { type: boolean }
        ca_pem: { type: string, description: 'PEM of the trusted CA (public data); only GET /api/v1/admin/directories/{id} fills it' }
        bind_dn: { type: string }
        bind_password_set: { type: boolean }
        base_dn: { type: string }
        base_filter: { type: string, description: canonical form }
        attributes:
          type: object
          properties: { uid: { type: string }, email: { type: string }, display_name: { type: string }, first_name: { type: string }, last_name: { type: string } }
        size_limit: { type: integer, minimum: 1, maximum: 1000 }
        time_limit_seconds: { type: integer, minimum: 1, maximum: 60 }
        last_test:
          type: object
          nullable: true
          properties: { at: { type: string, format: date-time }, outcome: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DirectoryConnectionInput:
      type: object
      additionalProperties: false
      description: Create (name, kind, url, tls_mode, bind_dn, bind_password and base_dn required) or partial update (omitted bind_password keeps the stored one)
      properties:
        name: { type: string, minLength: 1, maxLength: 80, pattern: '^[^\p{Cc}]+$' }
        kind: { type: string, enum: [active_directory, openldap, other] }
        url: { type: string, maxLength: 512, description: 'ldap:// or ldaps:// URL; host name only, no IP literal' }
        tls_mode: { type: string, enum: [ldaps, starttls, plain] }
        allow_tls12: { type: boolean }
        ca_pem: { type: string, maxLength: 65536, description: '"" clears' }
        bind_dn: { type: string, maxLength: 1024 }
        bind_password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
        base_dn: { type: string, maxLength: 1024 }
        base_filter: { type: string, maxLength: 4096, description: RFC 4515 filter always ANDed into every search }
        attributes: { $ref: '#/components/schemas/DirectoryAttributes' }
        size_limit: { type: integer, minimum: 1, maximum: 1000 }
        time_limit_seconds: { type: integer, minimum: 1, maximum: 60 }
    DirectoryTestInput:
      type: object
      additionalProperties: false
      description: DirectoryConnectionInput plus connection_id; with connection_id and no bind_password the stored password of that connection (same tenant) is used
      properties:
        connection_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80, pattern: '^[^\p{Cc}]+$' }
        kind: { type: string, enum: [active_directory, openldap, other] }
        url: { type: string, maxLength: 512 }
        tls_mode: { type: string, enum: [ldaps, starttls, plain] }
        allow_tls12: { type: boolean }
        ca_pem: { type: string, maxLength: 65536 }
        bind_dn: { type: string, maxLength: 1024 }
        bind_password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
        base_dn: { type: string, maxLength: 1024 }
        base_filter: { type: string, maxLength: 4096 }
        attributes: { $ref: '#/components/schemas/DirectoryAttributes' }
        size_limit: { type: integer, minimum: 1, maximum: 1000 }
        time_limit_seconds: { type: integer, minimum: 1, maximum: 60 }
    TestResult:
      type: object
      description: ok:false is still 200; reason is the closed vocabulary, never server text
      properties:
        ok: { type: boolean }
        step: { type: string, nullable: true, enum: [connect, tls, bind, search_base], description: failing step }
        reason: { type: string, nullable: true }
        tls:
          type: object
          nullable: true
          properties: { version: { type: string }, peer_subject: { type: string } }
        duration_ms: { type: integer }
    SearchRequest:
      type: object
      additionalProperties: false
      description: Every field is optional; {} searches the whole connection base with (objectClass=*)
      properties:
        filter: { type: string, maxLength: 4096, description: 'RFC 4515 filter, ANDed after the connection base_filter; empty = (objectClass=*)' }
        base: { type: string, maxLength: 1024, description: must lie within the connection base_dn }
        scope: { type: string, enum: [one, sub], description: default sub }
    SearchResult:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              uid: { type: string }
              dn: { type: string }
              email: { type: string, nullable: true }
              display_name: { type: string }
              first_name: { type: string }
              last_name: { type: string }
              status: { type: string, enum: [new, existing_user, imported, invalid] }
              user_id: { type: string, format: uuid, nullable: true, description: for existing_user and imported }
              reason: { type: string, nullable: true, description: 'for invalid: no_email | invalid_email | value_too_long | multi_valued_uid | invalid_uid' }
        truncated: { type: boolean, description: size or time limit hit }
        out_of_scope: { type: integer, description: entries dropped because their DN left the base }
        effective_filter: { type: string, description: 'canonical (&<base_filter><filter>) actually sent' }
    SearchError:
      type: object
      required: [reason]
      properties:
        reason: { type: string, description: invalid_filter | invalid_base | validation_failed }
        message: { type: string, description: 'invalid_filter only: the parser position message, built from the submitted filter' }
    ImportRequest:
      type: object
      additionalProperties: false
      required: [uids]
      properties:
        uids: { type: array, minItems: 1, maxItems: 500, uniqueItems: true, items: { type: string } }
    ImportResult:
      type: object
      description: Partial success is still 200; every list is present (possibly empty)
      properties:
        created: { type: array, items: { $ref: '#/components/schemas/ImportItem' } }
        updated: { type: array, items: { $ref: '#/components/schemas/ImportItem' } }
        skipped:
          type: array
          description: 'no_email | invalid_email | email_in_use | duplicate_email | already_active | not_found_in_directory | value_too_long | multi_valued_uid | invalid_uid'
          items: { $ref: '#/components/schemas/ImportIssue' }
        failed:
          type: array
          description: directory_error | timeout | internal
          items: { $ref: '#/components/schemas/ImportIssue' }
    ImportItem:
      type: object
      properties: { uid: { type: string }, user_id: { type: string, format: uuid } }
    ImportIssue:
      type: object
      properties: { uid: { type: string }, reason: { type: string } }
    ActivateRequest:
      type: object
      additionalProperties: false
      required: [user_ids]
      properties:
        user_ids: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string, format: uuid } }
        role_ids: { type: array, items: { type: string, format: uuid } }
        group_ids: { type: array, maxItems: 50, items: { type: string, format: uuid } }
    ActivateResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: One item per requested user id
          items:
            type: object
            required: [user_id, outcome, invitation_id, reason]
            properties:
              user_id: { type: string, format: uuid }
              outcome: { type: string, enum: [invited, failed] }
              invitation_id: { type: string, format: uuid, nullable: true }
              reason: { type: string, nullable: true, description: 'failed only: invalid_state | not_found | internal' }
paths:
  /.well-known/jwks.json:
    get:
      operationId: jwks
      security: []
      summary: Published verification keys
      responses: { '200': { description: JWKS } }

  /api/v1/tenants/resolve:
    get:
      operationId: resolveTenant
      security: []
      summary: Resolve a tenant slug before sign-in (never reveals existence beyond slug validity)
      parameters: [{ name: slug, in: query, required: true, schema: { type: string } }]
      responses: { '200': { description: tenant display info }, '404': { description: unknown } }

  /api/v1/signin:
    post:
      operationId: signIn
      security: []
      summary: Sign in with email + password (+ tenant; omitted or blank → derived from the email domain) (step 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties: { tenant: { type: string, description: 'Tenant slug; omitted or blank → derived from the email domain (jane@acme.com → acme)' }, email: { type: string, format: email }, password: { type: string, maxLength: 1024 } }
      responses:
        '200': { description: 'signed in (session cookie set) or {"mfa_required": true, "challenge": "..."}' }
        '401': { description: invalid_credentials (identical for unknown email / wrong password / suspended tenant unless locked) }
        '423': { description: locked }
        '429': { description: rate_limited }
  /api/v1/signin/mfa:
    post:
      operationId: signInMfa
      security: []
      summary: Complete sign-in with a TOTP or recovery code (step 2)
      requestBody:
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [challenge, code], properties: { challenge: { type: string }, code: { type: string, maxLength: 16 } } } } }
      responses: { '200': { description: signed in }, '401': { description: invalid_credentials } }
  /api/v1/signin/mfa/webauthn/options:
    post:
      operationId: signInWebAuthnOptions
      security: []
      summary: Security-key request options for a pending sign-in (feature 018; the user's usable keys)
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [challenge], properties: { challenge: { type: string, maxLength: 128 } } } } } }
      responses: { '200': { description: '{"publicKey": PublicKeyCredentialRequestOptions}' }, '401': { description: invalid_challenge }, '423': { description: locked }, '429': { description: rate_limited } }
  /api/v1/signin/mfa/webauthn:
    post:
      operationId: signInWebAuthn
      security: []
      summary: Complete sign-in with a security-key assertion (step 2; failures count toward the lockout like a wrong code)
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [challenge, credential], properties: { challenge: { type: string, maxLength: 128 }, credential: { $ref: '#/components/schemas/WebAuthnCredential' } } } } } }
      responses: { '200': { description: signed in (as /signin/mfa) }, '401': { description: mfa_failed | key_flagged }, '423': { description: locked } }
  /api/v1/signout:
    post:
      operationId: signOut
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      summary: End the current session everywhere
      responses: { '204': { description: ended } }
  /api/v1/session:
    get:
      operationId: getSession
      summary: Current user, tenant, effective roles, display name and avatar (never phone)
      responses: { '200': { description: session info }, '401': { description: no session } }
  /api/v1/session/token:
    post:
      operationId: issueAccessToken
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      summary: Mint a fresh access token from the live session
      responses: { '200': { description: token, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } } }
  /api/v1/sessions:
    get:
      operationId: listSessions
      summary: List my sessions
      responses: { '200': { description: sessions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Session' } } } } } }
  /api/v1/sessions/{id}/revoke:
    post:
      operationId: revokeSession
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      summary: Revoke one of my sessions
      responses: { '204': { description: revoked } }

  /api/v1/me/password:
    post:
      operationId: changePassword
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      summary: Change password (ends all other sessions)
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, required: [current_password, new_password], properties: { current_password: { type: string }, new_password: { type: string } } } } } }
      responses: { '204': { description: changed }, '400': { description: policy violation (reason password_policy) }, '401': { description: invalid_credentials } }
  /api/v1/me/mfa/enroll:
    post:
      operationId: enrollMfa
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      summary: Start TOTP enrolment (returns otpauth URI; not yet enabled)
      responses: { '200': { description: 'otpauth URI + enrolment id' } }
  /api/v1/me/mfa/confirm:
    post:
      operationId: confirmMfa
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, required: [code], properties: { code: { type: string, maxLength: 16 } } } } } }
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      summary: Confirm enrolment with a code; returns recovery codes once
      responses: { '200': { description: recovery codes } }
  /api/v1/me/mfa/disable:
    post:
      operationId: disableMfa
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, required: [code], properties: { code: { type: string, maxLength: 16 } } } } } }
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      summary: Disable TOTP (requires current password + code; refused when tenant requires MFA)
      responses: { '204': { description: disabled }, '403': { description: mfa_required } }
  /api/v1/me/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, required: [code], properties: { code: { type: string, maxLength: 16 } } } } } }
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      summary: Regenerate recovery codes
      responses: { '200': { description: codes } }

  /api/v1/me/mfa:
    get:
      operationId: getMyMfa
      summary: My second factors (authenticator app, security keys, recovery codes left, tenant requirement)
      responses: { '200': { description: state, content: { application/json: { schema: { $ref: '#/components/schemas/MfaState' } } } } }
  /api/v1/me/mfa/webauthn/register/options:
    post:
      operationId: webAuthnRegisterOptions
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      summary: Start registering a named security key (attestation none; my keys excluded)
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [name], properties: { name: { type: string, maxLength: 256 } } } } } }
      responses: { '200': { description: '{"publicKey": PublicKeyCredentialCreationOptions}' }, '400': { description: invalid_name }, '404': { description: webauthn_disabled }, '409': { description: name_taken | key_limit } }
  /api/v1/me/mfa/webauthn/register:
    post:
      operationId: webAuthnRegister
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      summary: Finish registering a security key; the first factor returns recovery codes once
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [credential], properties: { credential: { $ref: '#/components/schemas/WebAuthnCredential' } } } } } }
      responses: { '201': { description: '{"key": SecurityKey, "recovery_codes"?: [..]}' }, '400': { description: registration_failed }, '409': { description: already_registered | name_taken | key_limit } }
  /api/v1/me/mfa/webauthn/{id}:
    patch:
      operationId: renameSecurityKey
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      summary: Rename one of my security keys
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [name], properties: { name: { type: string, maxLength: 256 } } } } } }
      responses: { '200': { description: '{"key": SecurityKey}' }, '400': { description: invalid_name }, '404': { description: not_found }, '409': { description: name_taken } }
    delete:
      operationId: removeSecurityKey
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      summary: Remove one of my security keys after confirming a current factor (code, recovery code or key assertion)
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { code: { type: string, maxLength: 16 }, credential: { $ref: '#/components/schemas/WebAuthnCredential' } } } } } }
      responses: { '204': { description: removed }, '403': { description: confirmation_failed (counts toward the lockout) }, '404': { description: not_found }, '409': { description: last_factor_required }, '423': { description: locked } }
  /api/v1/me/mfa/stepup/options:
    post:
      operationId: stepUpOptions
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      summary: Security-key request options that confirm a removal
      responses: { '200': { description: '{"publicKey": PublicKeyCredentialRequestOptions}' }, '404': { description: webauthn_disabled }, '409': { description: no_keys } }

  /api/v1/recovery:
    post:
      operationId: requestRecovery
      security: []
      summary: Request a password-recovery email (always 202)
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, required: [email], properties: { tenant: { type: string }, email: { type: string } } } } } }
      responses: { '202': { description: accepted regardless of existence } }
  /api/v1/recovery/complete:
    post:
      operationId: completeRecovery
      security: []
      summary: Set a new password with a recovery token (single use)
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, required: [token, new_password], properties: { token: { type: string }, new_password: { type: string } } } } } }
      responses: { '204': { description: done }, '400': { description: invalid_token | password_policy } }

  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      security: []
      summary: Accept an invitation and set the initial password
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, required: [token, display_name, password], properties: { token: { type: string }, display_name: { type: string }, password: { type: string } } } } } }
      responses: { '200': { description: account active + signed in }, '400': { description: invalid_token } }

  /api/v1/admin/users:
    get:
      operationId: listUsers
      summary: List users (admin); q matches email, first or last name; status=imported lists imported users; items carry avatar_url, groups, directory and invitation_id
      parameters: [{ name: q, in: query, schema: { type: string } }, { name: status, in: query, schema: { type: string } }, { name: cursor, in: query, schema: { type: string } }]
      responses: { '200': { description: page of users }, '403': { description: denied } }
  /api/v1/admin/invitations:
    post:
      operationId: createInvitation
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      summary: Invite a user with roles (admin)
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, required: [email], properties: { email: { type: string }, role_ids: { type: array, items: { type: string, format: uuid } }, group_ids: { type: array, maxItems: 50, items: { type: string, format: uuid } }, first_name: { $ref: '#/components/schemas/Name' }, last_name: { $ref: '#/components/schemas/Name' } } } } } }
      responses: { '202': { description: invitation queued (identical whether or not the email already exists) } }
  /api/v1/admin/invitations/{id}/resend:
    post:
      operationId: resendInvitation
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string } }]
      responses: { '202': { description: queued } }
  /api/v1/admin/users/{id}/roles:
    put:
      operationId: setUserRoles
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string } }]
      summary: Replace a user's roles (admin; cannot grant permissions the actor lacks; last-owner protected)
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, properties: { role_ids: { type: array, items: { type: string } } } } } } }
      responses: { '200': { description: updated }, '403': { description: denied | self_escalation | last_owner }, '409': { description: 'invalid_state (imported user)' } }
  /api/v1/admin/users/{id}/deactivate:
    post:
      operationId: deactivateUser
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: deactivated; sessions revoked }, '403': { description: last_owner }, '409': { description: 'invalid_state (imported user)' } }
  /api/v1/admin/users/{id}/reactivate:
    post:
      operationId: reactivateUser
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: reactivated }, '409': { description: 'invalid_state (imported user)' } }
  /api/v1/admin/users/activate:
    post:
      operationId: activateUsers
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      summary: Invite imported users (admin); roles and groups pass the escalation check once, before any invitation
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActivateRequest' } } } }
      responses:
        '200': { description: per-user outcomes, content: { application/json: { schema: { $ref: '#/components/schemas/ActivateResult' } } } }
        '400': { description: validation_failed | malformed_body }
        '403': { description: forbidden | self_escalation }
  /api/v1/admin/users/{id}/remove-imported:
    post:
      operationId: removeImportedUser
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string } }]
      summary: Delete an imported user that was never activated (admin; no e-mail)
      responses:
        '204': { description: removed }
        '403': { description: forbidden }
        '404': { description: not_found }
        '409': { description: 'invalid_state (not imported)' }
  /api/v1/admin/users/{id}/sessions/revoke:
    post:
      operationId: revokeUserSessions
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string } }]
      summary: Force sign-out everywhere
      responses: { '204': { description: revoked } }
  /api/v1/admin/users/{id}/mfa:
    get:
      operationId: getUserMfa
      summary: A user's second-factor methods (admin; key names and use, never key material or credential ids)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: '{"totp", "keys": [{name, created_at, last_used_at, flagged}], "recovery_codes_left"}' }, '403': { description: forbidden }, '404': { description: not_found } }
  /api/v1/admin/users/{id}/mfa/reset:
    post:
      operationId: resetUserMfa
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string } }]
      summary: Remove a user's authenticator app, security keys and recovery codes and end their sessions (admin; not self, not a more privileged user)
      responses: { '204': { description: reset }, '403': { description: forbidden }, '404': { description: not_found }, '409': { description: 'invalid_state (imported user)' } }
  /api/v1/roles:
    get: { operationId: listRoleNames, summary: 'Subject picker (feature 005): slug and display name of the tenant roles, any signed-in member', responses: { '200': { description: roles } } }
  /api/v1/admin/roles:
    get: { operationId: listRoles, summary: List roles with permissions, responses: { '200': { description: roles } } }
    post:
      operationId: createRole
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      summary: Create a custom role
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }
      responses: { '201': { description: created }, '403': { description: self_escalation } }
  /api/v1/admin/roles/{id}:
    put:
      operationId: updateRole
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string } }]
      summary: Update a custom role's permissions (built-ins immutable)
      responses: { '200': { description: updated }, '403': { description: builtin | self_escalation } }
  /api/v1/admin/roles/{id}/remove:
    post:
      operationId: removeRole
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string } }]
      summary: Remove a custom role (unassigns everyone)
      responses: { '204': { description: removed } }
  /api/v1/admin/permissions:
    get: { operationId: listPermissions, summary: Registered permissions (resource:action + description), responses: { '200': { description: list } } }
  /api/v1/admin/policy:
    get: { operationId: getPolicy, summary: Tenant security policy, responses: { '200': { description: policy, content: { application/json: { schema: { $ref: '#/components/schemas/Policy' } } } } } }
    put:
      operationId: updatePolicy
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Policy' } } } }
      responses: { '200': { description: updated }, '400': { description: validation } }
  /api/v1/admin/audit:
    get:
      operationId: queryAudit
      summary: Tenant audit trail (filter by user, event_type, time; cursor-paged)
      parameters:
        - { name: user_id, in: query, schema: { type: string } }
        - { name: event_type, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, schema: { type: string } }
      responses: { '200': { description: page of events, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }, next_cursor: { type: string } } } } } } }
  /api/v1/admin/clients:
    get: { operationId: listClients, summary: Registered client applications, responses: { '200': { description: list } } }
    post:
      operationId: createClient
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, required: [display_name, redirect_uris], properties: { display_name: { type: string, maxLength: 120 }, redirect_uris: { type: array, minItems: 1, maxItems: 10, items: { type: string, format: uri } }, public: { type: boolean } } } } } }
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      summary: Register a client application (redirect URIs; returns secret once for confidential clients)
      responses: { '201': { description: created } }

  /api/v1/operator/tenants:
    get: { operationId: listTenants, summary: List tenants (operator), responses: { '200': { description: tenants } } }
    post:
      operationId: createTenant
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      summary: Create a tenant and invite its first owner
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, required: [slug, display_name, owner_email], properties: { slug: { type: string }, display_name: { type: string }, owner_email: { type: string } } } } } }
      responses: { '201': { description: created } }
  /api/v1/operator/tenants/{id}/suspend:
    post:
      operationId: suspendTenant
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: suspended; all sessions revoked } }
  /api/v1/operator/tenants/{id}/reactivate:
    post:
      operationId: reactivateTenant
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: reactivated } }
  /api/v1/operator/grants:
    post:
      operationId: createOperatorGrant
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      summary: Create a time-limited, audited access grant into a tenant (SR-006)
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, required: [tenant_id, reason, duration], properties: { tenant_id: { type: string }, reason: { type: string, minLength: 10 }, duration: { type: string, example: 1h } } } } } }
      responses: { '201': { description: grant } }

  /api/v1/me/profile:
    get:
      operationId: getMyProfile
      summary: Own profile including phone
      responses: { '200': { description: profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } } }
    put:
      operationId: updateMyProfile
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      summary: Update own names/phone (audited by field name only); success carries X-Freya-Identity-Refresh
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileUpdate' } } } }
      responses: { '200': { description: updated profile }, '400': { description: validation_failed } }
  /api/v1/me/avatar:
    put:
      operationId: uploadMyAvatar
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      summary: Replace own avatar (raw image body PNG/JPEG/WebP up to 2 MiB; re-encoded server-side)
      x-freya-max-body-bytes: 2162688
      requestBody: { required: true, content: { image/png: { schema: { type: string, format: binary } }, image/jpeg: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } } } }
      responses: { '200': { description: avatar_url }, '400': { description: validation_failed (unsupported_type | not_an_image | too_large_dimensions | decode_failed) }, '413': { description: body_too_large } }
    delete:
      operationId: removeMyAvatar
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      responses: { '204': { description: removed (idempotent) } }
  /api/v1/users/{id}/avatar/{avatar_id}:
    get:
      operationId: getAvatar
      summary: Avatar bytes (image/jpeg, private immutable caching); 404 for other tenants, unknown ids and stale hashes
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: avatar_id, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }]
      responses: { '200': { description: image/jpeg }, '404': { description: not_found } }
  /api/v1/users:
    get:
      operationId: searchUsers
      summary: 'Subject picker (feature 005): public profiles of active members of the caller tenant matching name or email (<= 20; same rate limit as lookups)'
      parameters: [{ name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }]
      responses: { '200': { description: list, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/PublicProfile' } } } } } } }, '429': { description: rate_limited } }
  /api/v1/users/lookup:
    post:
      operationId: lookupUsers
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      summary: Batch lookup of display name and avatar (same tenant; unknown ids omitted)
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [ids], properties: { ids: { type: array, maxItems: 100, items: { type: string, format: uuid } } } } } } }
      responses: { '200': { description: list, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/PublicProfile' } } } } } } } }
  /api/v1/users/{id}:
    get:
      operationId: lookupUser
      summary: Display name and avatar of a member of the caller's tenant (rate-limited; uniform 404)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: public profile, content: { application/json: { schema: { $ref: '#/components/schemas/PublicProfile' } } } }, '404': { description: not_found } }
  /api/v1/admin/users/{id}/profile:
    get:
      operationId: getUserProfile
      summary: Any user's profile including phone (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } } }
    put:
      operationId: updateUserProfile
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileUpdate' } } } }
      responses: { '200': { description: updated }, '400': { description: validation_failed } }
  /api/v1/admin/users/{id}/avatar:
    delete:
      operationId: removeUserAvatar
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: removed } }
  /api/v1/admin/users/{id}/effective-roles:
    get:
      operationId: effectiveRoles
      summary: Roles a user holds with their sources (direct / groups)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: list, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/EffectiveRole' } } } } } } } }
  /api/v1/admin/users/{id}/groups:
    get:
      operationId: userGroups
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: groups of the user, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/UserGroupRef' } } } } } } } }
  /api/v1/admin/groups:
    get:
      operationId: listGroups
      summary: Groups of the tenant with member counts and roles (admin)
      parameters: [{ name: q, in: query, schema: { type: string, maxLength: 64 } }]
      responses: { '200': { description: list, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Group' } } } } } } } }
    post:
      operationId: createGroup
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GroupInput' } } } }
      responses: { '201': { description: created }, '400': { description: validation_failed }, '409': { description: name_taken } }
  /api/v1/admin/groups/{id}:
    get:
      operationId: getGroup
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: group with roles and member count } }
    put:
      operationId: updateGroup
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GroupInput' } } } }
      responses: { '200': { description: updated }, '409': { description: name_taken } }
  /api/v1/admin/groups/{id}/remove:
    post:
      operationId: deleteGroup
      summary: Delete a group; member_count must equal the current count
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [member_count], properties: { member_count: { type: integer, minimum: 0 } } } } } }
      responses: { '204': { description: deleted; access withdrawn }, '409': { description: member_count_mismatch } }
  /api/v1/admin/groups/{id}/members:
    get:
      operationId: listGroupMembers
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: cursor, in: query, schema: { type: string } }]
      responses: { '200': { description: page of members } }
    post:
      operationId: addGroupMembers
      summary: Add users (max 100); existing members are no-ops; escalation guard applies
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [user_ids], properties: { user_ids: { type: array, minItems: 1, maxItems: 100, items: { type: string, format: uuid } } } } } } }
      responses: { '200': { description: added count }, '403': { description: self_escalation }, '404': { description: unknown or cross-tenant user } }
  /api/v1/admin/groups/{id}/members/{user_id}/remove:
    post:
      operationId: removeGroupMember
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: removed (idempotent) } }
  /api/v1/admin/groups/{id}/roles:
    put:
      operationId: setGroupRoles
      summary: Replace the group's roles; cannot grant permissions the actor lacks (owners exempt)
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [role_ids], properties: { role_ids: { type: array, maxItems: 100, items: { type: string, format: uuid } } } } } } }
      responses: { '200': { description: role slugs }, '403': { description: self_escalation } }
  /api/v1/admin/directories:
    get:
      operationId: listDirectories
      summary: LDAP directory connections of the tenant (directory:manage)
      responses:
        '200': { description: list, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/DirectoryConnection' } } } } } } }
        '403': { description: forbidden }
    post:
      operationId: createDirectory
      summary: Create a connection; the bind password is sealed and never returned (directory:manage)
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryConnectionInput' } } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryConnection' } } } }
        '400': { description: validation_failed | invalid_url | invalid_filter | invalid_base | invalid_ca | insecure_transport }
        '403': { description: forbidden }
        '409': { description: duplicate | limit_reached }
        '422': { description: target_refused }
  /api/v1/admin/directories/test:
    post:
      operationId: testDirectoryInput
      summary: Test unsaved settings; connection_id without bind_password reuses that connection's stored password only for its own url, tls_mode and ca_pem (directory:manage)
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryTestInput' } } } }
      responses:
        '200': { description: result (ok false is still 200), content: { application/json: { schema: { $ref: '#/components/schemas/TestResult' } } } }
        '400': { description: validation_failed | invalid_url | invalid_ca | insecure_transport }
        '404': { description: unknown or cross-tenant connection_id }
        '422': { description: target_refused }
        '429': { description: rate_limited }
  /api/v1/admin/directories/{id}:
    get:
      operationId: getDirectory
      summary: One connection including ca_pem (directory:manage)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: connection, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryConnection' } } } }
        '404': { description: not_found }
    put:
      operationId: updateDirectory
      summary: Partial update; an omitted bind_password keeps the stored one unless url, tls_mode or ca_pem change (then validation_failed) (directory:manage)
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryConnectionInput' } } } }
      responses:
        '200': { description: updated, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryConnection' } } } }
        '400': { description: validation_failed | invalid_url | invalid_filter | invalid_base | invalid_ca | insecure_transport }
        '404': { description: not_found }
        '409': { description: duplicate }
        '422': { description: target_refused }
  /api/v1/admin/directories/{id}/remove:
    post:
      operationId: deleteDirectory
      summary: Delete a connection; users already imported stay (directory:manage)
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: deleted }, '404': { description: not_found } }
  /api/v1/admin/directories/{id}/test:
    post:
      operationId: testDirectory
      summary: Test a saved connection and record last_test (directory:manage)
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: result (ok false is still 200), content: { application/json: { schema: { $ref: '#/components/schemas/TestResult' } } } }
        '404': { description: not_found }
        '429': { description: rate_limited }
  /api/v1/admin/directories/{id}/search:
    post:
      operationId: searchDirectory
      summary: Preview directory entries under the connection base with their import status; nothing is written (directory:manage)
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SearchRequest' } } } }
      responses:
        '200': { description: preview, content: { application/json: { schema: { $ref: '#/components/schemas/SearchResult' } } } }
        '400': { description: 'invalid_filter (with message, before any network call) | invalid_base | validation_failed | insecure_transport', content: { application/json: { schema: { $ref: '#/components/schemas/SearchError' } } } }
        '403': { description: forbidden }
        '404': { description: not_found }
        '429': { description: rate_limited }
        '502': { description: unreachable | tls_failed | invalid_credentials | base_not_found | directory_error }
        '504': { description: timeout }
  /api/v1/admin/directories/{id}/import:
    post:
      operationId: importDirectory
      summary: Import the chosen entries (re-fetched by uid under the base) as inactive users (directory:manage)
      parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ImportRequest' } } } }
      responses:
        '200': { description: per-entry outcomes (partial success), content: { application/json: { schema: { $ref: '#/components/schemas/ImportResult' } } } }
        '400': { description: validation_failed | insecure_transport }
        '403': { description: forbidden }
        '404': { description: not_found }
        '429': { description: rate_limited }
        '502': { description: 'unreachable | tls_failed | invalid_credentials | base_not_found | directory_error (nothing imported)' }
        '504': { description: 'timeout (nothing imported)' }
  /authorize:
    get:
      operationId: authorize
      security: []
      summary: OAuth 2.1 authorization endpoint (code + PKCE S256 only); renders the console sign-in
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
      responses: { '302': { description: redirect back with code+state after sign-in }, '400': { description: invalid_request } }
  /api/v1/oauth/token:
    post:
      operationId: oauthToken
      security: []
      summary: Exchange an authorization code (+ code_verifier) for an access token
      requestBody: { content: { application/x-www-form-urlencoded: { schema: { type: object, additionalProperties: false, required: [grant_type, code, redirect_uri, client_id, code_verifier], properties: { grant_type: { type: string, enum: [authorization_code] }, code: { type: string }, redirect_uri: { type: string }, client_id: { type: string }, code_verifier: { type: string }, client_secret: { type: string } } } } } }
      responses: { '200': { description: token, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }, '400': { description: invalid_grant } }
