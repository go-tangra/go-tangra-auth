# Development / e2e stack for services/auth. Never use these credentials outside a workstation.
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: auth
    ports: ["5432:5432"]
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--requirepass", "dev", "--user", "auth", "on", ">dev", "~*", "&*", "+@all"]
    ports: ["6379:6379"]
  openfga:
    image: openfga/openfga:v1.20.0
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://postgres:dev@timescaledb:5432/openfga?sslmode=disable
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: dev-openfga-key
      OPENFGA_PLAYGROUND_ENABLED: "false"
    depends_on: [timescaledb]
    ports: ["8080:8080", "8081:8081"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
